version: "2"
sql:
  - engine: postgresql
    schema:
      - "supabase/migrations/*.sql"
    queries:
      - "db/queries/users.sql"
      - "db/queries/onboarding.sql"
      - "db/queries/events.sql"
      - "db/queries/lists.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
